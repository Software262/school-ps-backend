name: PR Quality (Template + Copilot)

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PR template
        id: template_check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- pr-template-check -->";

            const placeholders = {
              description: "Brief description of what this PR does and why.",
              related: "Fixes #123",
              testing: "Describe the tests you performed and how to verify them."
            };

            function getSection(heading) {
              const regex = new RegExp(`^##\\s+${heading}[\\s\\S]*?(?=\\n##\\s+|$)`, "mi");
              const match = body.match(regex);
              return match ? match[0] : "";
            }

            function sectionText(section, heading) {
              return section.replace(new RegExp(`^##\\s+${heading}`, "i"), "").trim();
            }

            const missing = [];

            const descriptionSection = getSection("Description");
            if (!descriptionSection) {
              missing.push("Description section is missing.");
            } else {
              const text = sectionText(descriptionSection, "Description");
              if (!text || text === placeholders.description || /^n\\/a$/i.test(text)) {
                missing.push("Description must be filled out.");
              }
            }

            const typeSection = getSection("Type of Change");
            if (!typeSection) {
              missing.push("Type of Change section is missing.");
            } else if (!/\[[xX]\]/.test(typeSection)) {
              missing.push("Select at least one item in Type of Change.");
            }

            const relatedSection = getSection("Related Issues");
            const isBugFix = /\[[xX]\]\s*Bug fix/i.test(getSection("Type of Change"));
            const isSevere = /grave|severe|critical|critico|crítico/i.test(body);
            const requiresIssue = isBugFix && isSevere;

            if (requiresIssue) {
              if (!relatedSection) {
                missing.push("Related Issues section is required for severe bug fixes.");
              } else {
                const text = sectionText(relatedSection, "Related Issues");
                const mentionsIssue = /#\d+/.test(text);
                if (!mentionsIssue) {
                  missing.push("Severe bug fixes must reference an issue (e.g., #123).");
                }
              }
            }

            const testingSection = getSection("Testing");
            if (!testingSection) {
              missing.push("Testing section is missing.");
            } else {
              const text = sectionText(testingSection, "Testing");
              const allowedNA = /n\\/a|no aplica|not applicable/i.test(text);
              if (!text || text === placeholders.testing || (!allowedNA && text.length < 3)) {
                missing.push("Testing must include what you ran (or explicitly say N/A).");
              }
            }

            const checklistSection = getSection("Checklist");
            if (!checklistSection) {
              missing.push("Checklist section is missing.");
            } else {
              const items = checklistSection.match(/- \[[ xX]\] .+/g) || [];
              if (items.length === 0) {
                missing.push("Checklist items were not found.");
              } else {
                const unchecked = items.filter(item => !/\[[xX]\]/.test(item));
                if (unchecked.length > 0) {
                  missing.push("All checklist items must be checked.");
                }
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const filenames = files.map(file => file.filename);


            const passed = missing.length === 0;
            core.setOutput("passed", passed ? "true" : "false");

            const statusLine = passed
              ? "✅ All required sections are complete."
              : "❌ Missing or incomplete items detected.";

            const missingList = missing.length
              ? missing.map(item => `- ${item}`).join("\n")
              : "- None";

            const filesPreview = filenames.slice(0, 20).map(file => `- ${file}`).join("\n") || "- (No files detected)";
            const moreFiles = filenames.length > 20 ? `\n_And ${filenames.length - 20} more._` : "";
            const report = `${marker}\n## PR template compliance\n${statusLine}\n\n### Missing or incomplete\n${missingList}\n\n### Files considered\n${filesPreview}${moreFiles}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });

            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: report
              });
            }

      - name: Install GitHub Copilot CLI
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
        run: |
          gh extension install github/gh-copilot || gh extension upgrade github/gh-copilot

      - name: Collect PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --name-only > changed_files.txt
          gh pr diff ${{ github.event.pull_request.number }} --stat > diff.stat
          gh pr diff ${{ github.event.pull_request.number }} --patch > diff.patch
          head -c 120000 diff.patch > diff.trim.patch

      - name: Build Copilot prompt
        run: |
          cat <<'EOF' > copilot_prompt.md
          You are a PR reviewer. Use ONLY the changed files list and the provided diff.
          Your output must be a clear, actionable Markdown report.

          Report requirements:
          - Summary of changes based strictly on diff.stat and diff.trim.patch.
          - Key files list with a short description for each.
          - Risks or points of attention.
          - Suggested tests based on the changes.
          - Do not review files outside the list.

          Include a section named "Evidence" with anything still missing from the PR description.
          EOF

          echo "\n## Pull Request Template" >> copilot_prompt.md
          cat .github/pull_request_template.md >> copilot_prompt.md

          echo "\n\n## Files changed" >> copilot_prompt.md
          cat changed_files.txt >> copilot_prompt.md

          echo "\n\n## Diff stats" >> copilot_prompt.md
          cat diff.stat >> copilot_prompt.md

          echo "\n\n## Diff (trimmed)" >> copilot_prompt.md
          cat diff.trim.patch >> copilot_prompt.md

      - name: Generate Copilot review
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          gh copilot -p "$(cat copilot_prompt.md)" --assistant > copilot_review.md

      - name: Publish Copilot review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const marker = "<!-- copilot-pr-review -->";
            const body = fs.readFileSync("copilot_review.md", "utf8").trim();
            const full = `${marker}\n${body}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });

            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: full
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: full
              });
            }

      - name: Enforce PR template completion
        if: always() && steps.template_check.outputs.passed != 'true'
        run: |
          echo "PR template is incomplete. See the PR comment for details."
          exit 1
